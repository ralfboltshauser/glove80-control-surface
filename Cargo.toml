[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/control-core",
  "crates/surface-protocol",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ralfboltshauser/glove80-control-surface"
rust-version = "1.95"
version = "0.0.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"

[profile.release]
lto = "thin"
strip = true
